[project]
name = "frogs-bayes-weather"
version = "1.0.0"
description = "Code and data to reproduce 'Non-linear microclimatic constraints on calling activity in two terrestrial breeding frogs of the Yungas Andean forests'"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Versions pinned to the environment the paper's results were produced with.
dependencies = [
    "numpy==2.3.2",
    "pandas==2.3.2",
    "scipy==1.16.1",
    "matplotlib==3.10.6",
    "statsmodels==0.14.5",
    "patsy==1.0.1",
    "pymc==6.0.1",
    "pytensor==3.0.3",
    "bambi==0.18.0",
    "formulae==0.6.2",
    "arviz==1.1.0",
    "xarray==2026.4.0",
    "h5netcdf==1.8.1",
    "h5py==3.16.0",
    "joblib==1.5.2",
    "ipykernel==6.30.1",
    "ipython==9.5.0",
    "nbconvert==7.17.1",
    "jupyterlab>=4.2",
]

[tool.uv]
package = false
